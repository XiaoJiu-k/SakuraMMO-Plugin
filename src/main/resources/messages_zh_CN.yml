reload:
  start: "&7正在重载 SakuraMMO 配置…"
  done: "&a重载完成：&f{classes} &a个职业、&f{skills} &a个技能、&f{messages} &a条消息。"
  playerdata-untouched: "&8（玩家数据未重载，如需生效请让玩家重新登录）"

debug:
  header: "&8&m────────&r &d调试信息 &8&m────────"
  line-class: "&7职业：&f{class}"
  line-resources: "&7资源：&f{resources}"
  line-cooldowns: "&7冷却中：&f{cooldowns}"
  line-modifiers: "&7AuraSkills 修饰符：&f{modifiers}"
