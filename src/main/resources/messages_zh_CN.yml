  list-header: "&8&m────────&r &d可选职业 &8&m────────"
  list-entry: "&8· &f{id} &7— &f{display} &8({role})"
  list-entry-current: "&8· &a{id} &7— &a{display} &8({role}) &a◀ 当前"
