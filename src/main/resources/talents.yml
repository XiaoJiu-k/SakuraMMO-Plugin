# ============================================================
# SakuraMMO 天赋树（阶段三）
# 节点效果类型（key 决定生效通道）：
#   stat         AuraSkills 属性（9 项之一），值 = 每级加成
#   cooldown     全局冷却缩减，值 = 每级比例（0.05 = 5%/级）
#   cost         全局资源消耗降低，值 = 每级比例
#   resource-max 职业资源上限加成，值 = 每级点数
#   resource-regen 职业资源每秒回复加成，值 = 每级
#   skill-damage 指定技能的伤害倍率，值 = 每级比例（0.15 = +15%/级）
# requires: {node: <节点id>, points: <需求点数>} —— 前置节点
# ============================================================

reset-cost: 500

ironwarden:
  display: 铁卫
  branch-a:
    name: 堡垒守卫
    color: "&6"
    nodes:
      ironwarden_fortress_stone:
        name: 石肤
        icon: SHIELD
        max: 3
        stat: health
        per-level: 3
        desc: "每级最大生命 +3"
      ironwarden_fortress_wall:
        name: 坚壁
        icon: IRON_BLOCK
        max: 2
        requires: {node: ironwarden_fortress_stone, points: 3}
        stat: toughness
        per-level: 2
        desc: "每级韧性 +2（减伤提升）"
