        requires: {node: ironwarden_fortress_wall, points: 2}
        cooldown: 0.05
        desc: "每级技能冷却缩减 +5%"
  branch-b:
    name: 战场统帅
    color: "&b"
    nodes:
      ironwarden_command_rage:
        name: 怒气不竭
        icon: BLAZE_POWDER
        max: 3
        resource-max: rage
        per-level: 20
        desc: "每级怒气上限 +20"
      ironwarden_command_slam:
        name: 裂地强化
        icon: GRAVEL
        max: 2
        requires: {node: ironwarden_command_rage, points: 3}
