# ============================================================
# 技能池（v4.1）：7 职业 × 12 = 84（4 基础 + 3 战术 + 1 终极 + 4 被动）
#
# unlock-level：玩家原版等级达到后可施放/绑定（实时判定）
# 被动（trigger: PASSIVE）：
#   passive-stat/passive-value → AuraSkills modifier passive_<id>（解锁自动挂载）
#   passive-special → 事件型被动（thorns=受伤反弹 / rage-surge=低血怒气翻倍）
# MythicMobs 效果配置见 plugins/MythicMobs/skills/ 各职业文件
# ============================================================

