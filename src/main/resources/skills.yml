# ============================================================
# 技能入口定义（35 个 = 7 职业 × (4 主动 + 1 被动)）
#
# 本文件只描述「入口」：谁可以放、花多少资源、多长冷却、怎么触发。
# 技能的实际效果一律由 MythicMobs 的 <mythic-skill> 执行，插件不重复实现。
#
# 字段
#   display-name  显示名
#   class         所属职业 id
#   mythic-skill  MythicMobs 技能 id（必须存在，否则启动时 WARN）
#   resource      消耗的资源 id（classes/<id>.yml 的 resources 段）
#   cost          消耗量
#   cooldown      冷却（秒，支持小数）
#   trigger       RIGHT_CLICK / RIGHT_CLICK_AIR / RIGHT_CLICK_BLOCK / LEFT_CLICK / PASSIVE
#   unlock.permission  解锁权限（留空表示只要职业匹配就解锁）
# ============================================================

