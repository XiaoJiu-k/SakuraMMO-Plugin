# ============================================================
# 牧师 priest —— 主治疗
# 资源：法力 0–1000（自然恢复 5/s）
# 注意：这里的「法力」是插件自有资源，与 AuraSkills 的 mana 是两套数值（P0 不联动）
# ============================================================
id: priest
display-name: 牧师
role: 主治疗
icon: GOLDEN_APPLE
description: 圣光的治疗者，团队的生命线。

stats:
  wisdom: 6
  regeneration: 4
  health: 2

resources:
  mana:
    display-name: "&9法力"
    max: 1000
    initial: 1000
    regen-per-second: 5

skills:
  # 主动技能（按解锁等级，Shift+1~4 可绑定其中 4 个）
  - priest_flash_heal                # Lv1  快速治疗  CD 3s
  - priest_smite                     # Lv1  惩戒  CD 6s
  - priest_renew                     # Lv5  恢复  CD 12s
  - priest_holy_surge                # Lv10 圣光涌流  CD 15s
  - priest_dispel                    # Lv15 驱散  CD 20s
  - priest_punish                    # Lv20 惩戒之怒  CD 12s
  - priest_mercy                     # Lv20 慈悲  CD 60s
  - priest_divine_hymn               # Lv30 神圣赞美诗  CD 120s
  - priest_guardian_spirit           # Lv40 守护之灵  CD 30s
  # 被动技能（达到等级自动生效，无需绑定）
  - priest_faith                     # Lv1  坚定信仰  被动
  - priest_mending                   # Lv15 修补之心  被动
  - priest_sacred_ward               # Lv30 圣佑  被动
  - priest_enlightenment             # Lv50 启迪  被动

equipment:
  allowed: [ WAND, STAFF, CLOTH_ARMOR ]
  forbidden: [ HEAVY_ARMOR, AXE ]
