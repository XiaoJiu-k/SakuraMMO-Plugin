# ============================================================
# 铁卫 ironwarden —— 主坦克
# 单一真源：本文件是职业「铁卫」的唯一权威定义
# 消费方：SakuraMMO 插件（属性加成 → AuraSkills modifier / 资源 / 技能入口）
# ============================================================
id: ironwarden
display-name: 铁卫
role: 主坦克
icon: SHIELD
description: 前排承伤，靠格挡与减伤建立仇恨。

# 属性加成：插件转成 AuraSkills 的 StatModifier
# stat 取值必须是 AuraSkills stats.yml 里的 9 项之一
# 修饰符实际名为 class_ironwarden_<stat>（AuraSkills 的 modifier 以名字为键，一个名字只能挂一项属性）
stats:
  health: 6          # +6 生命 → hp +6（×1 系数）
  toughness: 4       # +4 韧性 → damage_reduction（公式 -1×1.01^-v+1，v=4 ≈ 3.9% 减伤）
  strength: 3        # +3 力量 → attack_damage +1.2（×0.4 系数）

# 资源：怒气 0–100，受击 +5 / 攻击 +3，不自然恢复
resources:
  rage:
    display-name: "&c怒气"
    max: 100
    initial: 0
    regen-per-second: 0
    on-damage-taken: 5
    on-attack: 3

skills:
  # 主动技能（按解锁等级，Shift+1~4 可绑定其中 4 个）
  - ironwarden_shield_bash           # Lv1  盾击  CD 6s
  - ironwarden_tear                  # Lv1  撕裂  CD 8s
  - ironwarden_guardian_bulwark      # Lv5  守护壁垒  CD 20s
  - ironwarden_heavy_blow            # Lv10 重击  CD 10s
  - ironwarden_iron_taunt            # Lv15 铁壁嘲讽  CD 25s
  - ironwarden_ground_slam           # Lv20 大地践踏  CD 25s
  - ironwarden_revenge               # Lv20 复仇  CD 12s
  - ironwarden_ascension             # Lv30 天神下凡  CD 120s
  - ironwarden_last_breath           # Lv40 破釜沉舟  CD 30s
  - ironwarden_last_stand            # Lv45 背水一战  CD 45s
  # 被动技能（达到等级自动生效，无需绑定）
  - ironwarden_unbreakable           # Lv1  坚不可摧  被动
  - ironwarden_bloodlust             # Lv15 浴血奋战  被动
  - ironwarden_thorns                # Lv30 荆棘之甲  被动
  - ironwarden_shield_mastery        # Lv50 盾牌精通  被动

equipment:
  allowed: [ SWORD, AXE, SHIELD, HEAVY_ARMOR ]
  forbidden: [ BOW, WAND ]
