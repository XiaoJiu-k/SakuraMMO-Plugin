# ============================================================
# 圣骑士 paladin —— 防御辅助 / 副坦
# 资源：圣能 0–5（攻击 +1，消耗 1–3）
# ============================================================
id: paladin
display-name: 圣骑士
role: 防御辅助 / 副坦
icon: GOLDEN_SWORD
description: 圣光护体，攻守兼备的副坦与辅助。

stats:
  health: 4
  toughness: 3
  strength: 2
  wisdom: 2

resources:
  holy_power:
    display-name: "&e圣能"
    max: 5
    initial: 0
    regen-per-second: 0
    on-attack: 1

skills:
  # 主动技能（按解锁等级，Shift+1~4 可绑定其中 4 个）
  - paladin_judgement                # Lv1  审判  CD 6s
  - paladin_smite                    # Lv1  圣光惩击  CD 8s
  - paladin_consecration             # Lv5  奉献领域  CD 20s
  - paladin_hammer_wrath             # Lv10 怒锤  CD 10s
  - paladin_holy_shield              # Lv15 圣盾术  CD 25s
  - paladin_guardian_light           # Lv15 守护之光  CD 60s
  - paladin_divine_verdict           # Lv20 神圣裁决  CD 12s
  - paladin_avenging_wrath           # Lv30 愤怒之翼  CD 120s
  - paladin_sacred_pledge            # Lv40 圣契誓约  CD 30s
  # 被动技能（达到等级自动生效，无需绑定）
  - paladin_blessed_armor            # Lv1  祝福护甲  被动
  - paladin_inner_light              # Lv15 内在之光  被动
  - paladin_divine_grace             # Lv30 神圣恩泽  被动
  - paladin_crusader                 # Lv50 十字军之心  被动

equipment:
  allowed: [ SWORD, SHIELD, HEAVY_ARMOR ]
  forbidden: [ BOW ]
