# ============================================================
# 刺客 assassin —— 近战物理 DPS
# 资源：能量 0–100（自然恢复 10/s，攻击 +5）
# 副资源：连击点 0–5 —— P0 只留字段（reserved: true），P1 填逻辑
# ============================================================
id: assassin
display-name: 刺客
role: 近战物理 DPS
icon: IRON_SWORD
description: 阴影中的利刃，一击致命。

stats:
  strength: 4
  crit_chance: 5
  speed: 3

resources:
  energy:
    display-name: "&a能量"
    max: 100
    initial: 100
    regen-per-second: 10
    on-attack: 5
  combo:
    display-name: "&e连击点"
    max: 5
    initial: 0
    reserved: true      # P1：攒点 / 终结技消耗

skills:
  # 主动技能（按解锁等级，Shift+1~4 可绑定其中 4 个）
  - assassin_backstab                # Lv1  背刺  CD 5s
  - assassin_poison_blade            # Lv1  毒刃  CD 8s
  - assassin_shadow_step             # Lv5  暗影步  CD 18s
  - assassin_eviscerate              # Lv10 剔骨  CD 10s
  - assassin_blade_dance             # Lv15 刀刃旋舞  CD 25s
  - assassin_vanish                  # Lv20 消失  CD 12s
  - assassin_death_mark              # Lv30 死亡印记  CD 120s
  - assassin_smoke_dodge             # Lv30 烟雾闪避  CD 60s
  - assassin_shade_form              # Lv40 暗影形态  CD 30s
  # 被动技能（达到等级自动生效，无需绑定）
  - assassin_agility                 # Lv1  敏捷身法  被动
  - assassin_lethality               # Lv15 致命性  被动
  - assassin_evasion                 # Lv30 闪避本能  被动
  - assassin_assassinate             # Lv50 刺杀艺术  被动

equipment:
  allowed: [ DAGGER, SWORD, LEATHER_ARMOR ]
  forbidden: [ HEAVY_ARMOR, BOW ]
